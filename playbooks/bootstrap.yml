- name: Bootstrap web servers
  hosts: web
  become: true

  tasks:
    - name: Install base packages
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - htop
        - vim

    - name: Create deploy user
      user:
        name: deploy
        groups: sudo
        append: yes

    - name: Custom MOTD
      copy:
        dest: /etc/motd
        content: "Managed by Ansible"
